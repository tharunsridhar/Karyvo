name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mrfixmyhome
          POSTGRES_PASSWORD: mrfixmyhome
          POSTGRES_DB: mrfixmyhome_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mrfixmyhome" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mrfixmyhome:mrfixmyhome@localhost:5432/mrfixmyhome_test
      DATABASE_URL: postgresql://mrfixmyhome:mrfixmyhome@localhost:5432/mrfixmyhome_test
      JWT_SECRET: ci-secret-0123456789abcdef
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
