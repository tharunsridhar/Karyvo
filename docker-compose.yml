services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karyvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karyvo}
      POSTGRES_DB: ${POSTGRES_DB:-karyvo}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karyvo}"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-karyvo}:${POSTGRES_PASSWORD:-karyvo}@postgres:5432/${POSTGRES_DB:-karyvo}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-4000}:4000"

volumes:
  pgdata:
