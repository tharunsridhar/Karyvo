# Render blueprint: one free web service built from the Dockerfile, plus a free Render Postgres
# that is wired in automatically (no connection string to paste).
# Note: Render deletes free databases 30 days after creation, so re-seed or move to Neon after that.
databases:
  - name: mr-fix-my-home-db
    plan: free
    databaseName: mrfixmyhome
    user: mrfixmyhome

services:
  - type: web
    name: mr-fix-my-home
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mr-fix-my-home-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Loads the demo accounts and services on start (Render free has no shell to do it by hand)
      - key: AUTO_SEED
        value: "true"
      # Let the free database sleep: no background timer, visitor data cleaned after a day
      - key: SWEEP_INTERVAL_SECONDS
        value: "0"
      - key: DEMO_CLEANUP_HOURS
        value: "24"
      # Free-tier protection limits
      - key: MAX_USERS
        value: "300"
      - key: MAX_BOOKINGS
        value: "2000"
      - key: MAX_SERVICES
        value: "300"
      - key: DAILY_REQUEST_BUDGET
        value: "60000"
      - key: API_RATE_MAX
        value: "240"
